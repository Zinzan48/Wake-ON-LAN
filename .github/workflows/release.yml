name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Windows Release (.zip)
    runs-on: windows-latest
    shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve tag and verify Cargo.toml version
        id: meta
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ inputs.tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          $verFromTag = $tag.TrimStart('v')
          $cargoMatch = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $cargoMatch) {
            throw "無法從 Cargo.toml 讀取 version 欄位"
          }
          $cargoVer = $cargoMatch.Matches[0].Groups[1].Value
          if ($verFromTag -ne $cargoVer) {
            throw "Tag 版本 ($tag -> $verFromTag) 與 Cargo.toml 版本 ($cargoVer) 不一致，請先對齊後再建立 Tag。"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$cargoVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release archive (.zip) & SHA256SUMS
        id: pkg
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $bundleName = "wake-on-lan-tool-$tag-windows-x86_64"
          $stageDir = Join-Path "dist" $bundleName
          $zipPath = Join-Path "dist" "$bundleName.zip"
          $checksumPath = Join-Path "dist" "SHA256SUMS.txt"

          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item "target\release\wake-on-lan-tool.exe" -Destination $stageDir
          Copy-Item "README.md" -Destination $stageDir
          Copy-Item "CHANGELOG.md" -Destination $stageDir

          Compress-Archive -Path $stageDir -DestinationPath $zipPath -Force

          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $bundleName.zip" | Set-Content -Path $checksumPath -Encoding utf8

          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "checksum_path=$checksumPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Extract release notes from CHANGELOG.md
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $lines = Get-Content -Path "CHANGELOG.md" -Encoding utf8
          $capturing = $false
          $notes = New-Object System.Collections.Generic.List[string]
          $headerPattern = "^##\s+\[" + [regex]::Escape($ver) + "\]"

          foreach ($line in $lines) {
            if ($line -match $headerPattern) {
              $capturing = $true
              continue
            }
            if ($capturing -and $line -match '^##\s+\[') {
              break
            }
            if ($capturing) {
              $notes.Add($line)
            }
          }

          $content = ($notes -join "`n").Trim()
          if ([string]::IsNullOrWhiteSpace($content)) {
            $content = "Release ${{ steps.meta.outputs.tag }}"
          }
          $content | Set-Content -Path "dist\release-notes.md" -Encoding utf8

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $zipPath = "${{ steps.pkg.outputs.zip_path }}"
          $checksumPath = "${{ steps.pkg.outputs.checksum_path }}"

          gh release create $tag $zipPath $checksumPath `
            --title "Wake-on-LAN Tool $tag" `
            --notes-file "dist\release-notes.md"
